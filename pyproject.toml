[project]
name = "mta-open"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "branca>=0.8.1",
    "folium>=0.19.5",
    "geopandas>=1.0.1",
    "mapclassify>=2.8.1",
    "matplotlib>=3.10.1",
    "plotly>=6.0.0",
    "polars>=1.24.0",
    "streamlit>=1.39.0",
    "streamlit-folium>=0.24.0",
]

[tool.ruff]
line-length = 120

[[tool.mypy.overrides]]
module = ["geopandas", "plotly.*", "plotly", "pydeck", "folium", "folium.*", "streamlit_folium", "leafmap", "leafmap.*", "branca.*", "polars.*",]
ignore_missing_imports = true
